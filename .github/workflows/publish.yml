name: Publish to npm

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to publish"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        if: github.event_name == 'release'
        run: npm ci

      - name: Install dependencies for manual recovery
        if: github.event_name == 'workflow_dispatch'
        run: npm install --no-package-lock

      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check package contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --access public

      # CRM yalnız kayıt tutar; erişilemezse ya da reddederse yayın etkilenmez.
      - name: Report release to CRM
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
          PRODUCT: to-markdown
          TARGET_KEY: default
          CRM_ENVIRONMENT: production
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_STATUS: ${{ job.status == 'success' && 'succeeded' || 'failed' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: COMMIT_SHA="$(git rev-parse HEAD)" bash ci/notify-release-crm.sh
